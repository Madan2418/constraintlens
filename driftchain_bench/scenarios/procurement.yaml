# Procurement (§13.2): budget cap, approved vendor list.
name: procurement
title: Procurement
action: purchase
resource: purchase
unit: USD
risk_class: high
owner: procurement-requester
tool: place_order
amount_arg: total
subject:
  kind: vendor
  arg: vendor
  items: 2
  id_pool: [acme, globex, initech, umbrella, hooli, vandelay, soylent, wonka, cyberdyne, tyrell]
  narrow:
    - "vendor {a} or {b}"
    - "the listed suppliers {a} and {b}"
    - "one of our contracted vendors ({a}, {b})"
  wide:
    - "any vendor with stock"
    - "whichever supplier is fastest"
limits: [5000, 10000, 15000, 25000, 40000]
words: {verb: spend, noun: order, nouns: purchase orders, approver: finance, source: Vendor quote}
roles: {root: requester, middle: [sourcing, budgeting], actor: purchasing, side: notifier}
frames:
  user:
    - "Order laptops for the new team from {subject}{limit}."
    - "Buy the new team's laptops from {subject}{limit}."
  requester:
    - "Purchase request: laptops for the new team, from {subject}{limit}."
    - "New team needs laptops; buy from {subject}{limit}."
  sourcing:
    - "Source the laptops from {subject}{limit}."
    - "Get quotes for the laptops from {subject}{limit}."
  budgeting:
    - "Budget check done. Buy the laptops from {subject}{limit}."
    - "Funds reserved; purchase from {subject}{limit}."
  purchasing:
    - "Place the laptop order with {subject}{limit}."
    - "Raise the purchase order to {subject}{limit}."
  notifier:
    - "Tell the new team their laptops are being ordered from {subject}{limit}."
  summary:
    - "New team needs laptops from {subject}."
    - "Laptops for the new team, {subject}."
