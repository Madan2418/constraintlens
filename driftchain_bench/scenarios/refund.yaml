# Refund processing (ARCHITECTURE.md §13.2): dollar limit, approval above the limit.
name: refund
title: Refund processing
action: refund
resource: order
unit: USD
risk_class: high
owner: support-requester
tool: issue_refund
amount_arg: amount
subject:
  kind: order
  arg: order
  items: 1
  id_format: "{n}"
  id_range: [1000, 9999]
  narrow:
    - "order #{a}"
    - "order {a}"
    - "the customer's order #{a}"
  wide:
    - "all of the customer's orders"
    - "every order on this account"
limits: [50, 100, 150, 200, 300, 500]
words: {verb: refund, noun: refund, nouns: refunds, approver: a manager, source: CRM note}
roles: {root: intake, middle: [triage, review], actor: payments, side: notifier}
frames:
  user:
    - "Refund {subject} for this customer{limit}."
    - "Please refund {subject}{limit}."
  intake:
    - "Process a refund for {subject}{limit}."
    - "New refund request for {subject}{limit}."
    - "Refund requested on {subject}{limit}."
  triage:
    - "Customer is upset about {subject}. Resolve it with a refund{limit}."
    - "Resolve the complaint on {subject} with a refund{limit}."
  review:
    - "Account reviewed. Refund {subject}{limit}."
    - "Checked the history; go ahead and refund {subject}{limit}."
  payments:
    - "Issue the refund for {subject}{limit}."
    - "Pay out the refund on {subject}{limit}."
  notifier:
    - "Tell the customer we are refunding {subject}{limit}."
    - "Send the customer an update on the refund for {subject}{limit}."
  summary:
    - "Customer wants their money back on {subject}; handle it."
    - "Refund {subject}."
