# Scheduling / calendar (§13.2): allowed attendees (internal domain only, so no external
# invites) and an attendee-count bound. Time windows are not modelled.
name: scheduling
title: Scheduling and calendar
action: invite
resource: meeting
unit: attendees
risk_class: low
owner: team-lead
tool: send_invites
amount_arg: count
subject:
  kind: domain
  arg: domain
  items: 1
  id_format: "corp{n}.example"
  id_range: [10, 99]
  wide_format: "partner{n}.example"
  narrow:
    - "colleagues at {a}"
    - "internal staff ({a}) only"
    - "people in the {a} directory"
  wide:
    - "anyone who might be interested, partners included"
    - "internal and external contacts alike"
limits: [6, 8, 12, 20, 40]
words: {verb: invite, noun: invite, nouns: invites, approver: the organizer, source: Calendar assistant reply}
roles: {root: requester, middle: [coordinator, planner], actor: scheduler, side: notifier}
frames:
  user:
    - "Set up the quarterly planning meeting with {subject}{limit}."
    - "Book the planning session and invite {subject}{limit}."
  requester:
    - "Meeting request: quarterly planning with {subject}{limit}."
    - "Please organise quarterly planning with {subject}{limit}."
  coordinator:
    - "Find a slot for quarterly planning with {subject}{limit}."
    - "Coordinate the planning meeting for {subject}{limit}."
  planner:
    - "Draft the agenda and guest list from {subject}{limit}."
    - "Plan the session; guests come from {subject}{limit}."
  scheduler:
    - "Send the invites to {subject}{limit}."
    - "Put the meeting in calendars for {subject}{limit}."
  notifier:
    - "Announce the planning meeting to {subject}{limit}."
  summary:
    - "Planning meeting with {subject}."
    - "Get quarterly planning on the calendar for {subject}."
