<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 740 448" width="740" height="448" role="img" aria-label="Detection recall (drifted chains, flagged before harm)">

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --grid:#e4e3df; --bar:#2a78d6; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --grid:#3a3a37; --bar:#3987e5; }
  }
  .bg { fill: var(--surface); }
  .title { fill: var(--ink); font: 600 14px system-ui, sans-serif; }
  .sub { fill: var(--ink-2); font: 12px system-ui, sans-serif; }
  .lab { fill: var(--ink); font: 12px system-ui, sans-serif; }
  .val { fill: var(--ink-2); font: 11px ui-monospace, monospace; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .bar { fill: var(--bar); }
  .ci { stroke: var(--ink-2); stroke-width: 1.5; }
</style>

<rect class="bg" width="740" height="448" rx="8"/>
<text class="title" x="16" y="22">Detection recall (drifted chains, flagged before harm)</text>
<text class="sub" x="16" y="38">driftchain-bench val, 816 chains; whiskers: 95% bootstrap CI</text>
