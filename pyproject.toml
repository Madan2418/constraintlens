[project]
name = "constraintlens"
version = "0.1.0"
description = "Runtime framework for detecting semantic constraint drift in asynchronous multi-agent AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "redis>=5.0",
]

[project.optional-dependencies]
# Reference pipelines (ARCHITECTURE.md §17 pipelines/). Not needed by the service.
pipelines = [
    "langgraph>=0.2",
]
# Real Tier 2 judge and LLM extraction (ADR 0007). Without it the service runs rules-only.
judge = [
    "anthropic>=2.6",
]

[dependency-groups]
# Local Tier 1c NLI model and embedder (ADR 0007): uv sync --group models. CPU is enough.
models = [
    "sentence-transformers>=3.0",
]
dev = [
    "fakeredis>=2.23",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100,<6.156",  # 6.156+ ships a native extension; pure wheels keep CI and locked-down Windows hosts equal
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constraintlens"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker services (Redis); run with `make integration`",
]

[tool.coverage.run]
source = ["constraintlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
    "raise NotImplementedError",
]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md", "documentation"]  # never reformat the spec or docs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PT", "TCH"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow math symbols (𝒞, θ, Δ) in docstrings
    "N818",  # exception names are fixed by ARCHITECTURE.md §11.4
]

[tool.ruff.lint.isort]
known-first-party = ["constraintlens", "pipelines", "eval", "tests"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "constraintlens.domain.models._Frozen",
    "constraintlens.domain.models._Model",
]

# --------------------------------------------------------------------------- #
# mypy  (strict on the pure domain core, ARCHITECTURE.md §19.2)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["constraintlens", "pipelines"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["constraintlens.domain", "constraintlens.domain.*"]
strict = true

[[tool.mypy.overrides]]
# Optional, lazily imported model libraries (dependency group "models").
module = ["sentence_transformers"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# import-linter  (ARCHITECTURE.md §17 import rule)
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_packages = ["constraintlens", "pipelines"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain core imports no other layer"
type = "forbidden"
source_modules = ["constraintlens.domain"]
forbidden_modules = [
    "constraintlens.application",
    "constraintlens.adapters",
    "constraintlens.api",
    "constraintlens.sdk",
    "constraintlens.config",
    # "constraintlens.cli" is added when cli.py lands (Phase 9).
]

[[tool.importlinter.contracts]]
name = "Domain core imports no framework or I/O library"
type = "forbidden"
source_modules = ["constraintlens.domain"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn", "httpx", "requests", "aiohttp",
    "redis", "sqlalchemy", "aiosqlite", "sqlite3",
    "langgraph", "langchain", "langchain_core",
    "anthropic", "openai",
    "sentence_transformers", "transformers", "torch",
    "pydantic_settings", "typer",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application layer imports only the domain"
type = "forbidden"
source_modules = ["constraintlens.application"]
forbidden_modules = [
    "constraintlens.adapters",
    "constraintlens.api",
    "constraintlens.sdk",
    # "constraintlens.cli" is added when cli.py lands (Phase 9).
]

[[tool.importlinter.contracts]]
name = "Baseline pipelines and shared agents never touch ConstraintLens"
type = "forbidden"
source_modules = ["pipelines.baseline", "pipelines.common"]
forbidden_modules = ["constraintlens"]

[[tool.importlinter.contracts]]
name = "SDK carries no server-side code"
type = "forbidden"
source_modules = ["constraintlens.sdk"]
forbidden_modules = [
    "constraintlens.api",
    "constraintlens.application",
    "constraintlens.adapters.store",
    "fastapi", "starlette", "uvicorn", "sqlalchemy", "aiosqlite",
]
