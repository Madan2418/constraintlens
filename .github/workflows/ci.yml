# ARCHITECTURE.md §19.3. Stages are added as their phases land:
#   integration (Redis service) - Phase 4 (done), benchmark schema - Phase 6 (done),
#   dashboard build - Phase 9, smoke evaluation with ScriptedJudge - Phase 8.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports

  test:
    name: unit, contract, property (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: make test
      - run: make coverage-domain

  benchmark:
    name: benchmark schema and reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m driftchain_bench generate --version 0.1.0 --seed 7 --size 4000
      - run: uv run python -m driftchain_bench check

  integration:
    name: integration (Redis Streams)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m integration tests
      - run: uv run pytest tests/contract/test_queue_transport.py
