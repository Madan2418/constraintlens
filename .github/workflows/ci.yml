# ARCHITECTURE.md §19.3. Stages are added as their phases land:
#   integration (Redis service) - Phase 3/4, benchmark schema - Phase 6,
#   dashboard build - Phase 9, smoke evaluation with ScriptedJudge - Phase 8.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports

  test:
    name: unit, contract, property (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: make test
      - run: make coverage-domain
